mainSections   = ["posts"]
rssFullContent = true

[footer]
    since = 2026

[sidebar]
    emoji    = "💻"
    subtitle = "嵌入式工程师，热爱底层开发与开源硬件。"
    avatar   = "images/avatar.png"

[article]
    [article.license]
        enabled = false
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[cookies]
    enabled = false
